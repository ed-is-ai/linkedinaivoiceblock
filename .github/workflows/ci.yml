name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stale-check generated skill registry (D-05)
        run: npm run check-skill-registry

      - name: Stale-check generated tool registry (TOOL-01)
        run: npm run check-tool-registry

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test
